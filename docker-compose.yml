services:
  mcp-nacos:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-nacos:latest
    container_name: mcp-nacos
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      # MCP 传输与认证
      MCP_TRANSPORT: "${MCP_TRANSPORT:-streamable-http}"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
      MCP_STATELESS_HTTP: "${MCP_STATELESS_HTTP:-false}"
      MCP_LOG_LEVEL: "${MCP_LOG_LEVEL:-info}"
      # Nacos 连接：NACOS_BASE_URL = scheme://host[:port][/context-path]（必填）
      #   1.x/2.x 默认带 /nacos；3.x 默认无；经反向代理时代理前缀加在地址里
      NACOS_BASE_URL: "${NACOS_BASE_URL:?NACOS_BASE_URL is required}"
      NACOS_USERNAME: "${NACOS_USERNAME:-}"
      NACOS_PASSWORD: "${NACOS_PASSWORD:-}"
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-public}"
      NACOS_VERSION: "${NACOS_VERSION:-3}"
      NACOS_READ_ONLY: "${NACOS_READ_ONLY:-true}"
      NACOS_INSECURE: "${NACOS_INSECURE:-false}"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
